<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Text Alignment</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex justify-content-center align-items-center vh-100">
    <div class="position-relative overflow-hidden rounded shadow" style="max-width: 600px;">
        <img src="Figure_1.png" class="img-fluid w-100 d-block" alt="Sample Image">
        <div class="position-absolute top-50 start-50 translate-middle text-center w-100">
            <h1 class="text-danger fw-bold display-3 m-0" style="text-shadow: 2px 2px 8px rgba(0,0,0,0.7);">
                Vidya
            </h1>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
